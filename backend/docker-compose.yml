# GlobeTrotter — backend stack (PostgreSQL 16 + FastAPI API)
#
#   docker compose up --build
#   docker compose run --rm api python -m app.seeds.seed_data   # load demo data
#
# API:   http://localhost:8000        Docs: http://localhost:8000/docs

services:
  db:
    image: postgres:16-alpine
    container_name: globetrotter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: globetrotter
      POSTGRES_PASSWORD: globetrotter
      POSTGRES_DB: globetrotter
    ports:
      - "5432:5432"
    volumes:
      - globetrotter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globetrotter -d globetrotter"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: globetrotter-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://globetrotter:globetrotter@db:5432/globetrotter
      JWT_SECRET: dev-only-change-me
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"

volumes:
  globetrotter_pgdata:
